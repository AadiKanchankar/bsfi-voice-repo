# Seeded training utterances for the intent head (A3).
# Four languages per intent: English, Hindi (romanised and Devanagari),
# Marathi, and Hindi/Marathi-English code-mixed, because code-mixing is the
# normal case for this user base, not an edge case.
# out_of_scope carries the most and the widest variety: it is what protects the
# refusal path, and a thin out_of_scope class is how a banking bot ends up
# confidently answering a question about the CEO's phone number.

